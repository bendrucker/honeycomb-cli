version: 2

builds:
  - main: ./cmd/honeycomb
    binary: honeycomb
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    goarch:
      - amd64
      - arm64

archives:
  - format_overrides:
      - goos: windows
        formats:
          - zip

homebrew_casks:
  - name: honeycomb
    repository:
      owner: bendrucker
      name: homebrew-tap
      branch: main
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/bendrucker/honeycomb-cli
    description: Unofficial CLI for Honeycomb, modeled after the GitHub CLI
    binaries:
      - honeycomb
    # The binary is unsigned, so strip the quarantine flag Homebrew sets on
    # download to avoid Gatekeeper blocking the first run.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/honeycomb"]
          end

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^build\\(deps\\):"
  groups:
    - title: Features
      regexp: "^.*feat(\\(.+\\))??!?:.+$"
      order: 0
    - title: Bug Fixes
      regexp: "^.*fix(\\(.+\\))??!?:.+$"
      order: 1
    - title: Others
      order: 999
