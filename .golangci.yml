version: "2"

run:
  build-tags:
    - integration

linters:
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - govet
    - ineffassign
    - nilerr
    - revive
    - staticcheck
    - unused
  settings:
    revive:
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck
        - name: package-comments
  exclusions:
    rules:
      - linters:
          - revive
        text: exported function New\w*Cmd should have comment

formatters:
  enable:
    - gofmt

